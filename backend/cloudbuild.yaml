# Cloud Build configuration for Math Scribe Backend
# Builds and deploys to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/math-scribe-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/math-scribe-backend:latest'
      - '.'
    dir: 'backend'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/math-scribe-backend:$COMMIT_SHA'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/math-scribe-backend:latest'
    dir: 'backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'math-scribe-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/math-scribe-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/math-scribe-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/math-scribe-backend:latest'

# Build timeout (10 minutes - TeX Live takes a while to install)
timeout: '600s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
